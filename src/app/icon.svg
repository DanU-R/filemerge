<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FileMerge">
  <title>FileMerge</title>
  <!--
    Percikan: dokumen putih di atas bidang hijau aksi, satu baris aksen tangerine.

    Keterbacaan diuji pada 16px dan 32px (skrip uji menghitung sebaran warna):
    desain awal (dokumen kecil + dua lembar + dot) hanya menghasilkan ~7% piksel
    terang di 16px, sehingga terlihat seperti kotak hijau kosong. Versi ini
    membuat dokumen memenuhi bidang: ~26% terang di 16px, ~36% di 32px.
    Tanpa emoji.
  -->
  <rect width="64" height="64" rx="12" fill="#0E9F6E" />
  <rect
    x="7"
    y="5"
    width="50"
    height="54"
    rx="7"
    fill="#FFFFFF"
    stroke="#10342B"
    stroke-width="3.5"
  />
  <path d="M17 20h30" stroke="#FF8A3D" stroke-width="5" stroke-linecap="round" />
  <path d="M17 31h30M17 42h19" stroke="#0E9F6E" stroke-width="5" stroke-linecap="round" />
</svg>
